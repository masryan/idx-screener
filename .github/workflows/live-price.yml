name: IDX Live Price (Yahoo)

on:
  schedule:
    - cron: "*/5 2-8 * * 1-5" # tiap 5 menit, 09:00-15:59 WIB, Senin-Jumat
  workflow_dispatch: {}

jobs:
  live-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Jalankan --live-price
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-idx-full.mjs --live-price
