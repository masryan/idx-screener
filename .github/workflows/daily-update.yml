name: IDX Daily Technical (skip-fetch)
on:
  schedule:
    - cron: "0 11 * * 1-5"   # 18:00 WIB Sen-Jumat — SETELAH PC rumah selesai sync harian
  workflow_dispatch: {}
jobs:
  daily-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Hitung teknikal dari flows yang sudah ada (tidak menyentuh IDX)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-idx-full.mjs --skip-fetch