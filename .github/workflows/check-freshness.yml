name: IDX Data Freshness Check

on:
  schedule:
    # Tiap 30 menit, 08:30-16:30 WIB (01:30-09:30 UTC), Senin-Jumat.
    - cron: "0,30 1-9 * * 1-5"
  workflow_dispatch: {}

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cek kesegaran data stocks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STALE_THRESHOLD_MIN: "20"
        run: node scripts/check-freshness.mjs
