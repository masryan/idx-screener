name: Stockbit Historical Sync

on:
  schedule:
    # Tiap 30 menit, 09:00-16:00 WIB, Senin-Jumat (jam bursa IDX).
    # WIB = UTC+7, jadi 09:00-16:00 WIB = 02:00-09:00 UTC. Dipecah 2 baris
    # karena syntax cron standar tidak bisa nulis "tiap 30 menit TAPI
    # berhenti pas menit :00 di jam terakhir" dalam 1 baris:
    #   - baris 1: menit :00 & :30, jam 02-08 UTC (09:00-15:30 WIB)
    #   - baris 2: menit :00 saja, jam 09 UTC     (16:00 WIB, run terakhir)
    # Total 15x/hari kerja. Sebelumnya cuma 1x/hari (16:00 WIB) -- lihat
    # riwayat: itu diganti karena mau update harga lebih sering sepanjang
    # jam bursa, bukan cuma sekali setelah tutup.
    - cron: "0,30 2-8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

jobs:
  stockbit-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Tarik histori Stockbit -> price_history_stockbit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-stockbit-history.mjs
