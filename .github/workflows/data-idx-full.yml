name: IDX Full Sync (Harian)

on:
  schedule:
    - cron: "6 3,7,10 * * 1-5"   # 10:06, 14:06, 17:06 WIB — digeser dari :00 supaya tidak numpuk di jam sibuk global
  workflow_dispatch: {}

jobs:
  full-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hitung ulang teknikal + fundamental dari flows yang ada (TIDAK fetch IDX dari cloud)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-idx-full.mjs --skip-fetch
